<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="src/css/sub1.css" />
    <link rel="stylesheet" href="src/css/common.css" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="src/js/sub.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="scroll-area">
        <header>
          <h1>통계</h1>
        </header>
        <!-- === mascot === -->
        <section class="mascot">
          <div class="mascot-face">
            <div class="expression">
              <span class="left-eye"></span>
              <span class="right-eye"></span>
              <span class="mouth"></span>
            </div>
          </div>
          <div class="mascot-bubble">
            <p><span>테스트</span>를 제일 많이 하셨군요!</p>
          </div>
        </section>
        <!-- === chart === -->
        <section class="chart">
          <div class="chart-title">
            <h2>2026년 4월</h2>
            <div class="more"></div>
          </div>
          <ul class="chart-btn">
            <li class="active">주간</li>
            <li>월간</li>
          </ul>
          <div class="chart-bar">
            <h3>주간 총 달성률</h3>
            <div class="chart-result">
              <canvas id="todo-chart"></canvas>
            </div>
          </div>
          <div class="top3">
            <h3>주간 완료한 일 TOP 3</h3>
            <div class="top3-wrapper">
              <div class="first-prize prize-item">
                <div class="rank">1</div>
                <b>테스트입니다.</b>
                <span>완료 총 15회</span>
              </div>
              <div class="second-prize prize-item">
                <div class="rank">2</div>
                <b>테스트입니다.</b>
                <span>완료 총 14회</span>
              </div>
              <div class="third-prize prize-item">
                <div class="rank">3</div>
                <b>테스트입니다.</b>
                <span>완료 총 10회</span>
              </div>
            </div>
          </div>
        </section>
      </div>
      <!-- === nav === -->
      <nav>
        <div class="nav-area">
          <ul class="menu-item">
            <li>
              <a href="index.html">
                <div class="icon icon-home"></div>
              </a>
            </li>
            <li class="active">
              <a href="sub1.html">
                <div class="icon icon-chart"></div>
              </a>
            </li>
            <li>
              <a href="sub2.html">
                <div class="icon icon-setting"></div>
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </div>
  </body>
</html>
