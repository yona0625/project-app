<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="src/css/common.css" />
    <link rel="stylesheet" href="src/css/sub2.css" />

    <script type="module" src="src/js/sub2.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>설정</h1>
      </header>
      <!-- === account === -->
      <section class="account">
        <h2>계정</h2>
        <ul class="account-area">
          <li>사용자 설정</li>
          <li>백업</li>
          <li class="data-reset">데이터 초기화</li>
        </ul>
      </section>
      <!-- === app === -->
      <section class="app">
        <h2>앱 설정</h2>
        <ul class="app-area">
          <li class="select-theme">테마 설정</li>
          <li class="select-lang">언어 설정</li>
        </ul>
      </section>
      <!-- === other === -->
      <section class="other">
        <h2>기타</h2>
        <ul class="other-area">
          <li>앱 정보</li>
          <li>정책</li>
        </ul>
      </section>
      <!-- === dimmed === -->
      <div class="modal-dimmed"></div>
      <!-- === setting-screen === -->
      <div class="color-theme">
        <h2>테마 설정</h2>
        <button class="theme-close-btn" aria-label="테마 설정 닫기"></button>
        <ul class="color-list">
          <li class="item basic">
            <span class="color-text">blue (기본)</span>
            <div class="check-mark"></div>
          </li>
          <li class="item green">
            <span class="color-text">green</span>
            <div class="check-mark"></div>
          </li>
          <li class="item pink">
            <span class="color-text">pink</span>
            <div class="check-mark"></div>
          </li>
          <li class="item orange">
            <span class="color-text">orange</span>
            <div class="check-mark"></div>
          </li>
          <li class="item purple">
            <span class="color-text">purple</span>
            <div class="check-mark"></div>
          </li>
          <li class="item gray">
            <span class="color-text">gray</span>
            <div class="check-mark"></div>
          </li>
        </ul>
        <div class="theme-set">
          <h2>설정하기</h2>
        </div>
      </div>
      <div
        class="lang-setting"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lang-message"
      >
        <h2 id="lang-message">언어 설정</h2>
        <button class="lang-close-btn" aria-label="언어 설정 닫기"></button>
        <ul class="lang-list">
          <li>
            <input type="radio" name="lang" id="system" value="system" />
            <label for="system">시스템 설정</label>
          </li>
          <li>
            <input type="radio" name="lang" id="korean" value="korean" />
            <label for="korean">한국어</label>
          </li>
          <li>
            <input type="radio" name="lang" id="english" value="english" />
            <label for="english">English</label>
          </li>
          <li>
            <input type="radio" name="lang" id="japanese" value="japanese" />
            <label for="japanese">日本語</label>
          </li>
          <li>
            <input type="radio" name="lang" id="chinese" value="chinese" />
            <label for="chinese">中文</label>
          </li>
          <li>
            <input type="radio" name="lang" id="spanish" value="spanish" />
            <label for="spanish">Español</label>
          </li>
        </ul>
        <div class="lang-set">
          <h2>설정하기</h2>
        </div>
      </div>
      <!-- === modal === -->
      <div
        class="data-reset-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="reset-message"
      >
        <p id="reset-message">정말 삭제하시겠습니까?</p>
        <span>삭제한 데이터는 복구할 수 없습니다.</span>
        <ul class="reset-btn-group">
          <li class="reset-btn">삭제</li>
          <li class="cancel-btn">취소</li>
        </ul>
      </div>
      <!-- === nav === -->
      <nav>
        <div class="nav-area">
          <ul class="menu-item">
            <li>
              <a href="index.html">
                <div class="icon icon-home"></div>
              </a>
            </li>
            <li>
              <a href="sub1.html">
                <div class="icon icon-chart"></div>
              </a>
            </li>
            <li class="active" aria-current="page">
              <a href="sub2.html">
                <div class="icon icon-setting"></div>
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </div>
  </body>
</html>
